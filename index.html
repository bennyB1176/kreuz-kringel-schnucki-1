<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a1f">
<meta name="description" content="Isometrisches Aufbau- und Strategiespiel im Browser: Holz fällen, Steine abbauen, Siedlung errichten und eine Armee aufstellen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Siedler der Insel</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ======================= Ressourcen-Leiste ======================= -->
<header id="topbar">
  <div class="res" id="res-holz"    title="Holz"><span class="ico">🪵</span><span class="val">0</span></div>
  <div class="res" id="res-stein"   title="Stein"><span class="ico">🪨</span><span class="val">0</span></div>
  <div class="res" id="res-bretter" title="Bretter"><span class="ico">🪚</span><span class="val">0</span></div>
  <div class="res" id="res-quader"  title="Quader"><span class="ico">🧱</span><span class="val">0</span></div>
  <div class="res" id="res-werkzeug" title="Werkzeug"><span class="ico">🔨</span><span class="val">0</span></div>
  <div class="res" id="res-nahrung" title="Nahrung"><span class="ico">🍞</span><span class="val">0</span></div>
  <div class="res" id="res-pop"     title="Bevölkerung"><span class="ico">👥</span><span class="val">0/0</span></div>
  <button id="btn-menu" class="icon-btn" title="Menü">☰</button>
</header>

<!-- ======================= Hinweis-Zeile ======================= -->
<div id="toast"></div>
<div id="wavebar" class="hidden"><span id="wave-text"></span></div>

<!-- ======================= Untere Steuerung ======================= -->
<nav id="bottombar">
  <button class="tab-btn" data-panel="build">🏗️<span>Bauen</span></button>
  <button class="tab-btn" data-panel="units">🧍<span>Leute</span></button>
  <button class="tab-btn" data-panel="army">⚔️<span>Armee</span></button>
  <button class="tab-btn" id="btn-center">🎯<span>Held</span></button>
</nav>

<!-- ======================= Panels ======================= -->
<section id="panel" class="hidden">
  <div class="panel-head">
    <h2 id="panel-title">Bauen</h2>
    <button id="panel-close" class="icon-btn">✕</button>
  </div>
  <div id="panel-body"></div>
</section>

<!-- Auswahl-Info (Gebäude / Einheit) -->
<section id="selection" class="hidden">
  <div class="panel-head">
    <h2 id="sel-title">—</h2>
    <button id="sel-close" class="icon-btn">✕</button>
  </div>
  <div id="sel-body"></div>
</section>

<!-- Bau-Modus Overlay -->
<div id="buildbar" class="hidden">
  <span id="buildbar-text">Platzieren</span>
  <button id="buildbar-cancel">Abbrechen</button>
</div>

<!-- Menü / Speichern -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <h2>Menü</h2>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
