<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Siedler der Insel">
  <title>Siedler der Insel</title>

  <!-- Hintergrund: Wiese im Farbton des Spiels -->
  <rect width="64" height="64" rx="12" fill="#3d7330"/>
  <path d="M0 40 L32 24 L64 40 L64 52 Q64 64 52 64 L12 64 Q0 64 0 52 Z" fill="#356729"/>

  <!-- Bodenschatten -->
  <ellipse cx="32" cy="49" rx="21" ry="9" fill="#000" opacity=".22"/>

  <!-- Wände -->
  <path d="M11 30 L32 42 L32 53 L11 41 Z" fill="#7c5335"/>
  <path d="M53 30 L32 42 L32 53 L53 41 Z" fill="#a8734a"/>
  <!-- Fenster auf der Sonnenseite -->
  <path d="M41 38 L48 34 L48 40 L41 44 Z" fill="#f0b64a"/>
  <!-- Tür auf der Schattenseite -->
  <path d="M19 35 L26 39 L26 48 L19 44 Z" fill="#4f341d"/>

  <!-- Walmdach mit Überstand -->
  <path d="M8 30 L32 16 L32 8 L8 30 Z" fill="#6d2f22"/>
  <path d="M8 30 L32 44 L32 8 Z" fill="#8d3f2e"/>
  <path d="M56 30 L32 44 L32 8 Z" fill="#a04a36"/>
  <path d="M56 30 L32 16 L32 8 L56 30 Z" fill="#b45540"/>
  <!-- Firstlinien -->
  <g stroke="#5a2419" stroke-width="1.4" fill="none" opacity=".55">
    <path d="M32 8 L8 30 M32 8 L56 30 M32 8 L32 44"/>
  </g>
</svg>
